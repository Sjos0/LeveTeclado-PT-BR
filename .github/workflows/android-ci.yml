name: Android CI
'on':
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Use Android's default debug signing config in CI only
        run: |
          python3 - <<'PYCODE'
          p = 'app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          old = 'signingConfig = signingConfigs.getByName("debugConfig")'
          new = 'signingConfig = signingConfigs.getByName("debug")'
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one custom debug signing assignment')
          open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
          print('CI working copy uses Android default debug signing; repository source remains unchanged')
          PYCODE
      - name: Run unit tests and build debug APK
        timeout-minutes: 20
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=-Xmx448m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -Dfile.encoding=UTF-8" --stacktrace --info testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-debug.log"
      - name: Summarize debug build failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle-debug.log"
          if [ ! -f "$log" ]; then
            echo "::error::O log do Gradle nao foi gerado (falha antes do build)."
            exit 0
          fi
          summary="$(grep -E 'What went wrong|Execution failed|FAILED|error:|e: file|Caused by|Could not|Exception' "$log" | head -25 | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')"
          if [ -z "$summary" ]; then
            summary="$(tail -n 30 "$log" | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')"
          fi
          echo "::error::RESUMO DO ERRO DE BUILD DEBUG: ${summary}"
      - name: Verify debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: leve-teclado-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  release:
    name: Verify and publish signed release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64 secret'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing STORE_PASSWORD secret'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD secret'; exit 1; }
      - name: Install SDK and prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release-key.jks" >> "$GITHUB_ENV"
      - name: Set up Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Run Rust tests
        run: cargo test --manifest-path rust-core/Cargo.toml
      - name: Build native libraries from rust-core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o app/src/main/jniLibs build -p keyboard-core --release
      - name: Raise Gradle memory for release build (R8 needs more than the low-RAM default)
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+UseParallelGC -Dfile.encoding=UTF-8/' gradle.properties
          grep '^org.gradle.jvmargs' gradle.properties
      - name: Test and build signed release
        timeout-minutes: 25
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8" --stacktrace --info testDebugUnitTest assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-release.log"
      - name: Summarize release build failure
        if: failure()
        run: |
          log="$RUNNER_TEMP/gradle-release.log"
          if [ ! -f "$log" ]; then
            echo "::error::O log do Gradle nao foi gerado (falha antes do build)."
            exit 0
          fi
          summary="$(grep -E 'What went wrong|Execution failed|FAILED|error:|Caused by|Missing class|OutOfMemory|Could not|Exception|R8' "$log" | head -25 | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')"
          if [ -z "$summary" ]; then
            summary="$(tail -n 30 "$log" | sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')"
          fi
          echo "::error::RESUMO DO ERRO DE BUILD: ${summary}"
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/release/*.apk
      - name: Validate release metadata and prepare asset
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [ -n "$apk" ] || fail "Nenhum APK de release encontrado em app/build/outputs/apk/release"
          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt2 dump badging "$apk")"
          pkg_line="$(printf '%s\n' "$badging" | grep '^package:' || true)"
          echo "::notice::Linha do pacote no APK: ${pkg_line}"
          package_name="$(printf '%s\n' "$pkg_line" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          [ "$package_name" = "com.aistudio.tecladoptbr.kxqpva" ] || fail "Pacote errado no APK: '${package_name}'"
          expected_version="${GITHUB_REF_NAME#v}"
          actual_version="$(printf '%s\n' "$pkg_line" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          [ "$actual_version" = "$expected_version" ] || fail "versionName no APK '${actual_version}' diferente de '${expected_version}'"
          case "$GITHUB_REF_NAME" in
            v1.9) expected_code=10 ;;
            v1.9.1) expected_code=11 ;;
            *) expected_code="" ;;
          esac
          if [ -n "$expected_code" ]; then
            actual_code="$(printf '%s\n' "$pkg_line" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
            [ "$actual_code" = "$expected_code" ] || fail "versionCode no APK '${actual_code}' diferente de ${expected_code}"
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep "lib/$abi/libkeyboard_core.so" >/dev/null || fail "Biblioteca lib/$abi/libkeyboard_core.so ausente no APK"
          done
          unzip -p "$apk" lib/arm64-v8a/libkeyboard_core.so > "$RUNNER_TEMP/libkeyboard_core.so"
          nm -D "$RUNNER_TEMP/libkeyboard_core.so" | grep 'Java_com_example_keyboard_NativeEngine_nativeGetSuggestions' >/dev/null || fail "Simbolo JNI nativeGetSuggestions ausente na .so arm64"
          asset="teclado-pt-br-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$asset"
          sha256sum "$asset"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="teclado-pt-br-${GITHUB_REF_NAME}.apk"
          if [ "$GITHUB_REF_NAME" = "v1.9" ]; then
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "Teclado Leve PT-BR v1.9 — Configurações Material e ícones oficiais" \
              --notes-file docs/RELEASE_NOTES_v1.9.md
          elif [ -f "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md" ]; then
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "Teclado Leve PT-BR $GITHUB_REF_NAME" \
              --notes-file "docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          else
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --title "Leve Teclado $GITHUB_REF_NAME" \
              --generate-notes
          fi
      - if: always()
        name: Remove temporary signing key
        run: rm -f "$RUNNER_TEMP/release-key.jks"
