name: Desempenho no emulador (RAM e armazenamento)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  perf:
    name: Medir RAM e armazenamento no emulador
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM (aceleração do emulador)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar pacotes do SDK e da imagem do emulador
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-34;google_apis;x86_64'

      - name: Usar a assinatura de depuração padrão (só no CI)
        run: |
          python3 - <<'PYCODE'
          p = 'app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          old = 'signingConfig = signingConfigs.getByName("debugConfig")'
          new = 'signingConfig = signingConfigs.getByName("debug")'
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one custom debug signing assignment')
          open(p, 'w', encoding='utf-8').write(s.replace(old, new, 1))
          PYCODE

      - name: Compilar APK de depuração
        run: ./gradlew --no-daemon --max-workers=1 "-Dorg.gradle.jvmargs=-Xmx1536m -XX:+UseSerialGC -Dfile.encoding=UTF-8" assembleDebug

      - name: Medir no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          script: bash scripts/perf/medir.sh perf-results app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar resumo
        if: always()
        run: |
          if [ -f perf-results/resumo.txt ]; then
            { echo '## Resultado de desempenho (emulador)'; echo '```'; cat perf-results/resumo.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f perf-results/resumo.txt ]; then
            while IFS= read -r linha; do echo "::notice::$linha"; done < perf-results/resumo.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results/
          if-no-files-found: ignore
